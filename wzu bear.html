<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐻 文藻熊問答遊戲</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background-color: #cce7ff;
      margin: 0;
      padding: 20px;
      text-align: center;
      position: relative;
      overflow-x: hidden;
    }

    h1 {
      color: #6a1b9a;
      margin-bottom: 20px;
      font-size: clamp(24px, 3vw, 40px);
    }

    /* 分數右上角 */
    #score {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: clamp(18px, 2vw, 24px);
      background-color: rgba(255,255,255,0.6);
      padding: 8px 15px;
      border-radius: 8px;
    }

    /* 音樂按鈕 */
    #music-controls {
      position: absolute;
      top: 20px;
      left: 20px;
    }
    #music-controls img {
      width: 50px;
      cursor: pointer;
      margin-right: 10px;
      border: none;
      outline: none;
      background: none;
      transition: transform 0.3s;
    }
    #music-controls img:hover { transform: scale(1.2); }

    /* 遊戲容器 */
    #game-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 100px;
      padding: 0 5vw;
    }

    /* 左右圖片 */
    .image-side {
      width: clamp(250px, 35vw, 400px);
      height: auto;
      object-fit: contain;
      transform: rotate(-5deg);
      transition: transform 0.3s;
    }
    .image-side.right {
      transform: rotate(5deg);
    }

    /* 題目與選項 */
    #question-container {
      flex: 1 1 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 600px;
      margin: 20px auto;
    }

    #question {
      font-size: clamp(20px, 2.5vw, 36px);
      margin-bottom: 25px;
      color: #333;
    }

    #answers {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
    }

    .answer-btn {
      width: 100%;
      padding: 12px;
      font-size: clamp(16px, 1.8vw, 22px);
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background-color: #4CAF50;
      color: white;
      transition: transform 0.2s, background-color 0.3s;
    }

    .answer-btn:hover {
      background-color: #45a049;
      transform: scale(1.03);
    }

    /* 結束按鈕 */
    .end-buttons {
      display: none;
      margin-top: 30px;
      gap: 20px;
      justify-content: center;
    }
    .end-buttons button {
      padding: 12px 25px;
      font-size: clamp(16px, 2vw, 22px);
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background-color: #ff9800;
      color: white;
      transition: transform 0.2s, background-color 0.3s;
    }
    .end-buttons button:hover {
      background-color: #fb8c00;
      transform: scale(1.05);
    }

    /* 手機排版 */
    @media (max-width: 768px) {
      #game-container {
        flex-direction: column;
        align-items: center;
      }
      .image-side {
        width: 60vw;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <h1>🐻 文藻熊問答遊戲</h1>
  <div id="score">分數: 0</div>

  <!-- 音樂控制 -->
  <div id="music-controls">
    <img id="playBtn" src="images/Copilot_20251030_175625.png" alt="播放音樂">
    <img id="pauseBtn" src="images/Copilot_20251030_180030.png" alt="暫停音樂">
  </div>

  <!-- 遊戲主體 -->
  <div id="game-container">
    <img id="leftImage" class="image-side" src="images/未命名設計.png" alt="左圖">

    <div id="question-container">
      <div id="question">題目會出現在這裡</div>
      <div id="answers">
        <button class="answer-btn" id="btn0">選項1</button>
        <button class="answer-btn" id="btn1">選項2</button>
        <button class="answer-btn" id="btn2">選項3</button>
        <button class="answer-btn" id="btn3">選項4</button>
      </div>

      <div class="end-buttons" id="endButtons">
        <button id="restartBtn">重玩</button>
        <button id="homeBtn">返回首頁</button>
      </div>
    </div>

    <img id="rightImage" class="image-side right" src="images/未命名設計 copy.png" alt="右圖">
  </div>

  <!-- 音樂 -->
  <audio id="bgMusic" autoplay loop>
    <source src="溫馨.mp3" type="audio/mpeg">
    您的瀏覽器不支援音樂播放
  </audio>

  <script>
    const questions = [
      { question: "文藻熊是誰設計的？", answers: ["學校老師","德文科校友曾文衍","日本設計師","學生會"], correct: 1 },
      { question: "文藻熊的袖口上繡了什麼字？", answers: ["Servant","Service","Serviam","Spirit"], correct: 2 },
      { question: "文藻熊最初的用途是什麼？", answers: ["校慶禮物","義賣商品","活動吉祥物","校刊封面"], correct: 0 },
      { question: "文藻熊身上穿的服裝是？", answers: ["運動服","畢業袍","文藻制服","教職員服"], correct: 2 },
      { question: "文藻熊的義賣所得主要用於？", answers: ["建設校舍","助學基金","海外旅遊","活動獎金"], correct: 1 }
    ];

    let currentQuestion = 0;
    let score = 0;

    const questionEl = document.getElementById("question");
    const scoreEl = document.getElementById("score");
    const leftImage = document.getElementById("leftImage");
    const rightImage = document.getElementById("rightImage");
    const endButtons = document.getElementById("endButtons");
    const restartBtn = document.getElementById("restartBtn");
    const homeBtn = document.getElementById("homeBtn");

    const playBtn = document.getElementById("playBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const bgMusic = document.getElementById("bgMusic");

    playBtn.addEventListener("click", () => bgMusic.play());
    pauseBtn.addEventListener("click", () => bgMusic.pause());

    const btns = [];
    for (let i = 0; i < 4; i++) {
      btns[i] = document.getElementById("btn" + i);
      btns[i].addEventListener("click", () => checkAnswer(i));
    }

    function loadQuestion() {
      const q = questions[currentQuestion];
      questionEl.textContent = q.question;
      for (let i = 0; i < 4; i++) btns[i].textContent = q.answers[i];
    }

    function checkAnswer(selected) {
      const q = questions[currentQuestion];
      if (selected === q.correct) score += 20;
      scoreEl.textContent = "分數: " + score;
      currentQuestion++;
      if (currentQuestion < questions.length) {
        loadQuestion();
      } else {
        questionEl.textContent = "🎉 遊戲結束！總分：" + score + " 分";
        leftImage.style.display = "none";
        rightImage.style.display = "none";
        btns.forEach(b => b.style.display = "none");
        endButtons.style.display = "flex";
      }
    }

    restartBtn.addEventListener("click", () => {
      currentQuestion = 0;
      score = 0;
      scoreEl.textContent = "分數: 0";
      leftImage.style.display = "block";
      rightImage.style.display = "block";
      btns.forEach(b => b.style.display = "block");
      endButtons.style.display = "none";
      loadQuestion();
    });

    homeBtn.addEventListener("click", () => {
      window.location.href = "index.html"; // 回首頁
    });

    loadQuestion();
  </script>
</body>
</html>
